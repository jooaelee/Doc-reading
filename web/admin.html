<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우시 판독 관리</title>
<script>if (/\/admin\/$/.test(location.pathname)) location.replace(location.pathname.replace(/\/$/, '') + location.search + location.hash);</script>
<link rel="stylesheet" href="static/wuxi.css">
<style>
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.tile{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.tile:first-child{border-left:0}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{color:var(--ink2);font-size:12.5px;font-weight:600;margin-top:2px}
.tile .s{color:var(--muted);font-size:12px}
.tile.warn .v{color:var(--warn)}
.docs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:#fff}
.doc b{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.doc b span{color:var(--muted);font-weight:500;font-size:12px}
.doc p{margin:4px 0 0;color:var(--ink2);font-size:12.5px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.1);z-index:40;display:flex;flex-direction:column}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dh h3{margin:0;font-size:16px}
.drawer .db{padding:16px 20px 30px;overflow:auto;display:grid;gap:18px;align-content:start}
.drawer h4{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.pagechips{display:flex;flex-wrap:wrap;gap:5px}
.pagechips .chip{font-size:12px}
.chk-list{display:grid;gap:6px}
.chk-list div{display:flex;gap:8px;align-items:baseline;font-size:13px}
.chk-list .nm{font-weight:600;min-width:120px}
.rules-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.scopes{padding:10px;position:sticky;top:112px}
.scopes h4{font-size:12px;color:var(--muted);margin:12px 8px 6px;font-weight:700}
.scope{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.scope:hover{background:var(--bg)}
.scope.on{background:var(--accent-soft)}
.scope .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope .ct{color:var(--muted);font-size:12px;white-space:nowrap}
.scope .ct b{color:var(--warn)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px}
.seg button{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button .n{font-weight:500;opacity:.75;margin-left:4px;font-size:12px}
.rule-row td:first-child{width:72px}
.rule-row .txt{font-weight:600}
.rule-row .src{color:var(--muted);font-size:12px}
.rule-row .acts{white-space:nowrap;text-align:right}
.inherit{margin-top:14px}
.inherit table td{color:var(--ink2)}
.form-box{border:1px solid var(--line);background:#fafbfc;border-radius:var(--r-s);padding:14px;margin-bottom:12px}
.cd{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px 18px}
.cd+.cd{margin-top:12px}
.cd .top-l{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cd .txt{font-size:15px;font-weight:700;margin:8px 0 10px}
.cd .two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.cd .ev{font-size:12.5px}
.cd .ev li{margin:3px 0}
.cd .pv{background:#fafbfc;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px}
.cd .pv .big{font-size:14px;font-weight:700;margin-bottom:2px}
.sim{background:#fafbfc;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;line-height:1.6}
.sim+.sim{margin-top:8px}
.sim .big{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sim ul{margin:6px 0 0;padding-left:16px}
.sim .arrow{margin:0 4px;color:var(--muted)}
.cd .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.arrow{color:var(--muted);margin:0 4px}
.tl{display:grid;gap:0}
.tl .it{display:grid;grid-template-columns:130px 90px minmax(0,1fr);gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.tl .it:last-child{border-bottom:0}
.tl .tm{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.tl .tx{font-weight:600}
.tl .mt{color:var(--muted);font-size:12px;margin-top:2px}
.cmd{display:flex;gap:6px;align-items:center;background:#f3f5f8;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12.5px;margin:4px 0}
.cmd span{flex:1;min-width:0;overflow-x:auto;white-space:nowrap}
ol.howto{margin:6px 0 0;padding-left:20px;font-size:13px}
ol.howto li{margin:6px 0}
@media screen and (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile:nth-child(4){border-left:0}.tile:nth-child(n+4){border-top:1px solid var(--line)}.docs{grid-template-columns:repeat(2,minmax(0,1fr))}.cd .two{grid-template-columns:minmax(0,1fr)}}
@media screen and (max-width:860px){.rules-layout{grid-template-columns:minmax(0,1fr)}.scopes{position:static}.tl .it{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="card">
    <h1>우시 판독 관리</h1>
    <p id="gateLead">운영 비밀번호로 들어갑니다. 이름을 적으면 규칙을 바꾼 기록에 함께 남습니다.</p>
    <form id="loginForm" class="form">
      <label class="f">이름(선택)<input id="lgName" class="in" autocomplete="name" maxlength="30"></label>
      <label class="f">운영 비밀번호<input id="lgPw" class="in" type="password" autocomplete="current-password" required></label>
      <div class="err" id="lgErr"></div>
      <button class="btn pri" type="submit">들어가기</button>
    </form>
    <form id="setupForm" class="form" hidden>
      <div class="note info">처음 쓰는 PC입니다. 운영 화면과 고객 화면의 비밀번호를 정합니다. 8자 이상입니다.</div>
      <label class="f">이름(선택)<input id="suName" class="in" maxlength="30"></label>
      <label class="f">운영 화면 비밀번호<input id="suAdmin" class="in" type="password" autocomplete="new-password" required minlength="8"></label>
      <label class="f">고객 화면 비밀번호<input id="suUser" class="in" type="password" autocomplete="new-password" minlength="8"></label>
      <div class="err" id="suErr"></div>
      <button class="btn pri" type="submit">정하고 들어가기</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>우시 판독 관리</h1>
    <span class="sub">현황, 규칙, 학습을 관리합니다. 바꾼 규칙은 다음 판독부터 쓰입니다.</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <a class="btn ghost" href="./">고객 화면</a>
    <button class="btn ghost" id="logout" type="button">나가기</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-t="status" type="button">현황</button>
    <button data-t="rules" type="button">규칙<span class="n" id="nRules"></span></button>
    <button data-t="learn" type="button">학습<span class="n" id="nLearn"></span></button>
    <button data-t="history" type="button">이력</button>
    <button data-t="settings" type="button">설정</button>
  </nav>
  <div class="page" id="page"></div>
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>

<script>
const ROOT = location.pathname.replace(/admin\/?$/, '').replace(/[^/]*$/, '');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TAB = 'status', DAYS = 14, OV = null, RV = null, LV = null, HV = null, SV = null, SCOPE = '*', KIND = 'code', HFILTER = '', ADD_OPEN = false;
const SRC = {default: '기본값', manual: '사람 입력', learned: '학습'};
const KIND_ORDER = ['code', 'alias', 'header', 'guide', 'check', 'required'];
const KIND_DESC = {
  code: '품명이나 부품 번호가 같은 줄의 SAP 코드, 자재 코드, 원산지 같은 값을 채웁니다. 판독이 끝난 뒤 적용되고, 확인 화면에서 규칙으로 채운 칸은 왼쪽 청록 선으로 표시됩니다.',
  alias: '단위나 원산지의 표기를 G-ERP에 맞게 바꿉니다. 판독이 끝난 뒤 적용됩니다.',
  header: '서류 표에서 칸을 찾는 열 이름입니다. 기본 열 이름은 판독 지침에 이미 들어 있고, 공급사 서류에만 있는 열 이름을 더할 수 있습니다. 판독할 때 쓰입니다.',
  guide: '공급사 서류의 특징을 AI에게 알리는 문장입니다. 판독할 때 쓰입니다. 영어나 한국어로 씁니다.',
  check: 'AI 답과 상관없는 근거로 빠진 줄을 의심합니다. 서류 특성상 맞지 않는 검사는 그 공급사에서만 끕니다.',
  required: '비어 있으면 확인 화면에서 주의로 표시할 G-ERP 열입니다. 「또는」으로 묶은 열은 하나만 차도 됩니다.'
};

async function api(path, opt = {}) {
  const r = await fetch(ROOT + path, opt);
  if (r.status === 401) { showGate(); throw new Error('login'); }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) { if (!r.ok) throw new Error('요청이 실패했습니다(' + r.status + ')'); return r; }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ('요청이 실패했습니다(' + r.status + ')'));
  return d;
}
const post = (p, b) => api(p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})});
function toast(msg, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 3200); }
function fail(e) { if (e && e.message !== 'login') toast(e.message, true); }
const when = ts => { if (!ts) return ''; const d = new Date(ts * 1000); return `${d.getMonth() + 1}/${d.getDate()} ${d.toTimeString().slice(0, 5)}`; };
const num = n => (n == null ? 0 : n).toLocaleString('ko-KR');

function reasonModal(title, text, okLabel, opt = {}) {
  return new Promise(res => {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      ${opt.noReason ? '' : `<label class="f">바꾼 까닭(선택)<input class="in" id="mReason" maxlength="300" placeholder="예: 공급사가 열 이름을 바꿈"></label>`}
      <div class="acts"><button class="btn" type="button" data-v="0">그만두기</button><button class="btn ${opt.danger ? 'danger' : 'pri'}" type="button" data-v="1">${esc(okLabel)}</button></div></div></div>`;
    const done = v => { const r = v ? ($('#mReason') ? $('#mReason').value : '') : null; root.innerHTML = ''; res(r); };
    root.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => done(b.dataset.v === '1'));
    root.querySelector('.modal-bg').addEventListener('keydown', e => { if (e.key === 'Escape') done(false); if (e.key === 'Enter' && e.target.id === 'mReason') done(true); });
    (root.querySelector('#mReason') || root.querySelector('[data-v="1"]')).focus();
  });
}

// ───────── 들어가기
async function showGate() {
  $('#app').hidden = true; $('#gate').hidden = false;
  let st = {}; try { st = await (await fetch(ROOT + 'api/admin/state')).json(); } catch (e) {}
  $('#setupForm').hidden = !st.setup; $('#loginForm').hidden = !!st.setup;
  if (!st.configured && !st.setup) { $('#lgErr').textContent = '운영 비밀번호가 아직 없습니다. 서버에서 set-admin-password 명령으로 정하십시오.'; }
  setTimeout(() => (st.setup ? $('#suAdmin') : $('#lgPw')).focus(), 0);
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); $('#lgErr').textContent = '';
  try { await post('api/admin/login', {password: $('#lgPw').value, name: $('#lgName').value}); $('#lgPw').value = ''; boot(); }
  catch (err) { if (err.message !== 'login') $('#lgErr').textContent = err.message; }
};
$('#setupForm').onsubmit = async e => {
  e.preventDefault(); $('#suErr').textContent = '';
  try { await post('api/admin/setup', {admin: $('#suAdmin').value, user: $('#suUser').value, name: $('#suName').value}); boot(); }
  catch (err) { if (err.message !== 'login') $('#suErr').textContent = err.message; }
};
$('#logout').onclick = async () => { await fetch(ROOT + 'api/admin/logout', {method: 'POST'}); showGate(); };

async function boot() {
  const st = await (await fetch(ROOT + 'api/admin/state')).json();
  if (!st.auth) { showGate(); return; }
  $('#gate').hidden = true; $('#app').hidden = false; $('#who').textContent = st.name ? st.name + '님' : '';
  const h = location.hash.slice(1); go(['status', 'rules', 'learn', 'history', 'settings'].includes(h) ? h : 'status');
  refreshCounts();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.t));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== TAB) go(h); });
function go(t) {
  TAB = t; history.replaceState(null, '', '#' + t);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#page').innerHTML = '<p class="muted">불러오는 중입니다.</p>';
  ({status: loadStatus, rules: loadRules, learn: loadLearn, history: loadHistory, settings: loadSettings})[t]().catch(fail);
}
async function refreshCounts() {
  try { const lv = LV || await api('api/admin/learn'); const n = (lv.candidates || []).length;
    $('#nLearn').textContent = n ? n : ''; $('#nLearn').classList.toggle('hot', n > 0);
    const rv = RV || await api('api/admin/rules'); $('#nRules').textContent = rv.counts.active;
  } catch (e) {}
}

// ───────── 현황
const DOCS = [
  ['인보이스', '품목 줄의 기준입니다. 품명, 수량, 단위, 단가, 금액, PO 번호, PO 품목 번호, SAP 코드를 줄마다 읽고 총액과 대조합니다.'],
  ['포장명세서', '줄마다 순중량, 총중량, 케이스 번호를 읽어 같은 PO 품목의 인보이스 줄에 붙입니다.'],
  ['통관 용도설명서', 'SAP 코드와 원산지를 읽어 인보이스 줄에 채웁니다. 품명 앞부분이 여러 품목에 걸리면 코드를 붙이지 않습니다.'],
  ['운송장', 'B/L 번호, 개수, 중량을 읽어 엑셀의 선적 헤더에 씁니다. 약관과 구매 주문서는 판독에 보내지 않습니다.']
];
async function loadStatus() {
  OV = await api('api/admin/overview?days=' + DAYS); const s = OV.summary, v = s.verdicts;
  const kinds = s.kinds || {};
  $('#page').innerHTML = `
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0;font-size:17px">처리 현황</h2><span class="sp"></span>
      <label class="small muted">기간 <select class="in" id="days">${[7, 14, 30, 90].map(d => `<option value="${d}" ${d === DAYS ? 'selected' : ''}>최근 ${d}일</option>`).join('')}</select></label>
      <button class="btn sm" id="reload" type="button">새로 고침</button></div>
    <div class="tiles">
      <div class="tile"><div class="v">${num(s.done)}</div><div class="k">처리한 묶음</div><div class="s">${s.working ? `읽는 중 ${s.working}` : ''}${s.error ? ` 오류 ${s.error}` : ''}</div></div>
      <div class="tile"><div class="v">${num(s.lines)}</div><div class="k">품목 줄</div><div class="s">엑셀로 나간 줄</div></div>
      <div class="tile ${v['빠진 줄 의심'] ? 'warn' : ''}"><div class="v">${num(v['빠진 줄 의심'])}</div><div class="k">빠진 줄 의심</div><div class="s">확인 못 함 ${num(v['확인 못 함'])}</div></div>
      <div class="tile"><div class="v">${num(s.edited)}</div><div class="k">사람이 고친 묶음</div><div class="s">확정 ${num(s.confirmed)}</div></div>
      <div class="tile"><div class="v">${num(s.ruleCells)}</div><div class="k">규칙이 채운 칸</div><div class="s">쓰는 규칙 ${num(OV.rules.active)}개</div></div>
      <div class="tile"><div class="v">${s.avgWall == null ? '없음' : s.avgWall + '초'}</div><div class="k">평균 걸린 시간</div><div class="s">묶음 하나 기준</div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>서류별 처리</h2><p class="desc">묶음 안의 쪽을 서류 종류별로 가른 뒤, 종류마다 아래처럼 읽습니다. 숫자는 기간 안에 들어온 쪽 수입니다.</p>
      <div class="docs">${DOCS.map(([k, t]) => `<div class="doc"><b>${k}<span>${num(kinds[k] || 0)}쪽</span></b><p>${t}</p></div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><div><h2>들어온 서류 묶음</h2><p class="desc" style="margin:0">줄을 누르면 쪽 분류, 처리 단계, 적용된 규칙, 사람이 고친 값을 봅니다.</p></div></div>
      ${OV.jobs.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>올린 시각</th><th>공급사</th><th>서류</th><th class="num">품목 줄</th><th>빠짐 검사</th><th class="num">규칙</th><th class="num">사람 수정</th><th>상태</th><th class="num">걸린 시간</th></tr></thead><tbody>
      ${OV.jobs.map(j => `<tr class="click" data-id="${j.id}"><td class="nowrap">${when(j.created)}</td><td>${esc(j.supplier || '알아보지 못함')}</td>
        <td><div class="small">${esc(Object.entries(j.kinds).map(([k, n]) => k + ' ' + n).join(', ') || (j.files || []).join(', '))}</div><div class="tiny muted">파일 ${j.files.length}개, ${j.pages}쪽</div></td>
        <td class="num">${j.status === 'done' ? num(j.lines) : ''}</td><td>${verdictBadge(j)}</td>
        <td class="num">${j.ruleCells ? `<span class="bd rule">${j.ruleCells}칸</span>` : ''}${j.promptRules ? `<div class="tiny muted">지침 ${j.promptRules}</div>` : ''}</td>
        <td class="num">${j.edited || j.added ? `${j.edited}칸${j.added ? `, 줄 ${j.added}` : ''}` : ''}</td><td>${statusBadge(j)}</td><td class="num">${j.wall ? j.wall + '초' : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty"><b>기간 안에 들어온 서류가 없습니다</b>고객 화면에서 서류를 올리면 여기에 쌓입니다.</div>'}</div>`;
  $('#days').onchange = e => { DAYS = +e.target.value; loadStatus().catch(fail); };
  $('#reload').onclick = () => loadStatus().catch(fail);

// 정답 시뮬레이션(tools/rule_sim.py): 확정한 정답 세트에 규칙을 미리 적용해 Main 칸 정확도 전과 후를 본다
const pctTxt = v => v == null ? '-' : (100 * v).toFixed(1) + '%';
const pct2 = v => v == null ? '-' : (100 * v).toFixed(2) + '%';     // 정답 전체는 한 칸 차이도 보이게 소수 둘째 자리까지
function simDelta(s) {
  const d = 100 * ((s.after || 0) - (s.before || 0));
  if (Math.abs(d) < 0.005) return '<span class="bd def">그대로</span>';
  return `<span class="bd ${d > 0 ? 'ok' : 'bad'}">${d > 0 ? '+' : ''}${d.toFixed(2)}%p</span>`;
}
function simWarn(s) {
  const n = (s.broken || 0) + (s.wrong || 0);
  return n ? `<span class="bd bad" title="맞던 칸이 틀어지거나, 정답과 다른 값으로 채웁니다">정답과 다른 칸 ${n}</span>` : '';
}
function simBody(s, label) {
  if (!s) return '';
  if (!s.computable) return `<div class="sim"><div class="big">${esc(label)}</div>${esc(s.text || '')}${s.scopeCases ? ` <span class="muted">(이 범위 정답 ${s.scopeCases}건)</span>` : ''}</div>`;
  if (s.kind === 'check') return `<div class="sim"><div class="big">${esc(label)} ${s.missed ? `<span class="bd bad">놓칠 건 ${s.missed}</span>` : ''}</div>${esc(s.text)}
      ${(s.examples || []).length ? `<ul>${s.examples.slice(0, 4).map(e => `<li>${esc(e.case)}${e.missing ? `: 사람이 더한 줄 ${e.missing}` : ''}</li>`).join('')}</ul>` : ''}</div>`;
  if (!s.touched) return `<div class="sim"><div class="big">${esc(label)} <span class="bd def">그대로</span></div>${esc(s.text)}</div>`;
  return `<div class="sim"><div class="big">${esc(label)} ${simDelta(s)} ${simWarn(s)}</div>
      <div>정답 ${s.cases}건 Main 칸 <b>${pct2(s.before)}</b><span class="arrow">→</span><b>${pct2(s.after)}</b></div>
      ${(s.suppliers || []).slice(0, 4).map(p => `<div class="muted">${esc(p.name)} ${p.cases}건 ${pctTxt(p.before)}<span class="arrow">→</span>${pctTxt(p.after)}</div>`).join('')}
      <div>바로잡는 칸 <b style="color:var(--ok)">${s.fixed}</b>, 틀어지는 칸 <b style="color:var(--bad)">${s.broken}</b>, 틀린 값으로 채우는 칸 <b style="color:var(--bad)">${s.wrong}</b></div>
      ${(s.examples || []).length ? `<ul>${s.examples.slice(0, 3).map(e => `<li>${esc(e.case)} ${e.row}번째 줄 ${esc(e.col)}: ${esc(e.before || '빈 칸')}<span class="arrow">→</span>${esc(e.after)} ${e.ok === true ? '<span class="bd ok">정답과 같음</span>' : e.ok === false ? `<span class="bd bad">정답 ${esc(e.gold || '빈 칸')}</span>` : '<span class="bd def">정답에서 지운 줄</span>'}</li>`).join('')}</ul>` : ''}</div>`;
}
function simAllCard() {

        <li>터미널에서 <code>claude</code>를 실행하고 자기 계정으로 로그인합니다. 로그인되면 끝냅니다.${cmd('claude')}</li>
        <li>이 화면의 「연결 다시 확인」을 누릅니다. 계정에 자기 이메일이 보이면 됩니다.</li>
        <li>한 PC에서 여러 계정을 나눠 쓰려면 계정 폴더를 따로 두고 그 폴더로 로그인한 뒤, 아래 「계정 폴더」에 그 경로를 넣습니다. 위가 Windows(PowerShell), 아래가 맥과 리눅스입니다.${cmd('$env:CLAUDE_CONFIG_DIR="$HOME\\.claude-wuxi"; claude')}${cmd('CLAUDE_CONFIG_DIR=~/.claude-wuxi claude')}</li></ol></div>
      <div class="form" style="margin-top:12px"><div class="row"><label class="f" style="flex:2">계정 폴더(비우면 기본 계정)<input class="in mono" id="sDir" value="${esc(SV.configDir)}" placeholder="예: C:\\Users\\me\\.claude-wuxi"></label>
        <button class="btn" id="sDirSave" type="button" style="align-self:flex-end">저장</button></div></div></div>
    <div>
      <div class="card"><h2>판독 모델</h2><p class="desc">바꾸면 다음 판독부터 씁니다. 바꾼 뒤에는 설치 점검(selfcheck)으로 먼저 확인합니다.</p>
        <div class="form">${SV.models.map(m => `<label class="row" style="gap:8px;align-items:flex-start"><input type="radio" name="model" value="${m.id}" ${m.id === SV.model ? 'checked' : ''} style="margin-top:4px">
          <span><b>${esc(m.name)}</b> <span class="mono small muted">${m.id}</span><br><span class="small muted">${esc(m.note)}</span></span></label>`).join('')}
          ${SV.models.some(m => m.id === SV.model) ? '' : `<p class="small">지금 값: <span class="mono">${esc(SV.model)}</span></p>`}</div></div>
      <div class="card"><h2>보관 기간</h2><p class="desc">올린 서류와 결과를 이 기간이 지나면 지웁니다. 확정한 정답 자료도 같이 지워집니다.</p>
        <div class="row"><input class="in" id="sKeep" type="number" min="1" max="365" value="${SV.keepDays}" style="width:90px"><span>일</span><button class="btn sm" id="sKeepSave" type="button">저장</button></div></div>
      <div class="card"><h2>비밀번호</h2><p class="desc">8자 이상입니다. 바꾸면 그 화면에 들어와 있던 사람은 다시 들어와야 합니다.</p>
        <div class="form"><div class="row"><label class="f">고객 화면 ${SV.passwords.user ? '' : '<span class="bd warn">없음</span>'}<input class="in" id="pUser" type="password" autocomplete="new-password"></label><button class="btn sm" data-pw="user" type="button" style="align-self:flex-end">바꾸기</button></div>
          <div class="row"><label class="f">운영 화면<input class="in" id="pAdmin" type="password" autocomplete="new-password"></label><button class="btn sm" data-pw="admin" type="button" style="align-self:flex-end">바꾸기</button></div></div></div>
      <div class="card"><h2>규칙 옮기기</h2><p class="desc">다른 서버나 PC로 규칙을 옮길 때 씁니다. 저장소에 기본값으로 넣으려면 명령줄에서 <code>python tools/wuxi_rules.py export --to-default</code>를 실행합니다.</p>
        <div class="row"><a class="btn sm" href="${ROOT}api/admin/export">내보내기</a><label class="btn sm">가져오기<input type="file" id="imp" accept="application/json,.json" hidden></label></div></div>
    </div></div>
    <p class="tiny muted" style="margin-top:14px">판 ${esc(SV.version || '알 수 없음')} | 작업 폴더 <span class="mono">${esc(SV.paths.work)}</span></p>`;
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('복사했습니다.'); } catch (e) { toast('복사하지 못했습니다. 글을 직접 고르십시오.', true); } });
  $('#cRefresh').onclick = () => loadSettings(true).catch(fail);
  $('#cTest').onclick = async () => { $('#cTestOut').textContent = '보내는 중입니다.'; try { const r = await post('api/admin/claude-test');
    $('#cTestOut').textContent = r.ok ? `답을 받았습니다(${r.seconds}초).` : `실패했습니다: ${r.error}`; } catch (e) { fail(e); $('#cTestOut').textContent = ''; } };
  const save = async (b, msg) => { try { await post('api/admin/settings', b); toast(msg); loadSettings(true).catch(fail); } catch (e) { fail(e); } };
  $('#sDirSave').onclick = () => save({configDir: $('#sDir').value}, '계정 폴더를 저장했습니다.');
  document.querySelectorAll('input[name="model"]').forEach(r => r.onchange = () => save({model: r.value}, '판독 모델을 바꿨습니다.'));
  $('#sKeepSave').onclick = () => save({keepDays: $('#sKeep').value}, '보관 기간을 저장했습니다.');
  document.querySelectorAll('[data-pw]').forEach(b => b.onclick = async () => {
    const who = b.dataset.pw, el = who === 'user' ? $('#pUser') : $('#pAdmin');
    try { await post('api/admin/password', {who, password: el.value}); el.value = ''; toast('비밀번호를 바꿨습니다.'); } catch (e) { fail(e); }
  });
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; let data; try { data = JSON.parse(await f.text()); } catch (er) { toast('JSON 파일이 아닙니다.', true); return; }
    const reason = await reasonModal('규칙을 가져옵니다', `「${f.name}」의 규칙 ${(data.rules || []).length}개를 합칩니다. id가 같으면 가져온 쪽이 이깁니다.`, '가져오기'); if (reason == null) return;
    try { const r = await post('api/admin/import', {data, reason}); toast(`규칙 ${r.rules}개를 가져왔습니다.`); RV = null; } catch (er) { fail(er); }
  };
}
boot();
</script>
</body>
</html>
